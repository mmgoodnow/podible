name: Build and Push Docker Image

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg unzip wamerican
      - run: bun install --frozen-lockfile
      - run: bun run check:db-types
      - run: bun run typecheck
      - run: bun run build
      - run: bun run validate:runtime-scripts
      - run: bun test
      - run: bunx playwright install --with-deps chromium
      - run: bun run test/browser/spa.ts
      - run: bun run test/browser/books.ts
      - run: bun run test/browser/movies.ts
      - run: bun run test/browser/movie-shadow.ts
      - run: bun run test/browser/tv.ts
      - run: bun run test/browser/admin.ts
      - run: bun run test/browser/auth.ts
      - run: bun run test/browser/library-performance.ts
      - run: bun run test/browser/library-performance.ts
      - run: docker build -t podible-transmission-test .
      - run: docker run --rm --network none -v "$PWD/test:/app/test:ro" --entrypoint bun podible-transmission-test run test/lab/transmission-inner.ts
      - run: docker run --rm --network none -v "$PWD/test:/app/test:ro" --entrypoint bun podible-transmission-test run test/lab/book-migration-inner.ts
  docker:
    needs: verify
    uses: mmgoodnow/cd/.github/workflows/docker.yml@main
    secrets: inherit
